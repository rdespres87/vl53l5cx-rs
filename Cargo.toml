[package]
name = "vl53l5cx"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure #![no_std] Rust driver for the STMicroelectronics VL53L5CX 8x8 multizone Time-of-Flight sensor"
readme = "README.md"
repository = "https://github.com/rdespres87/vl53l5cx-rs"
documentation = "https://docs.rs/vl53l5cx"
keywords = ["vl53l5cx", "tof", "sensor", "embedded-hal", "lidar"]
categories = ["embedded", "no-std", "hardware-support"]

[features]
default = ["firmware-blob"]
firmware-blob = []
async = ["dep:embedded-hal-async", "dep:embassy-time"]
defmt = ["dep:defmt"]
log = ["dep:log"]

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }
embassy-time = { version = "0.5", optional = true }
defmt = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", features = ["eh1"] }
